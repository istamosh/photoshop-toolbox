[project]
name = "photoshop-toolbox"
version = "0.1.0"
description = "A collection of tools for image processing and Photoshop file manipulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=4.11.0.86",
    "pillow>=11.2.1",
    "scikit-image>=0.25.2",
    "imagehash>=4.3.1",
    "photoshop-python-api>=0.24.1",
    "pywin32>=306",
    "pyyaml>=6.0.2",
]
